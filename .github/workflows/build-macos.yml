name: Build macOS app

# - Smoke Linux (~1p): chạy MỌI push/PR để bắt regression sớm, khỏi phải chờ
#   người ta đẩy tag mới phát hiện lỗi (kiểu 'ffmpeg 8/9 bỏ filter_complex_script').
# - Build Mac (15-20p, tốn runner): giữ nguyên trigger cũ — thủ công / tag v*.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Chạy TRƯỚC build vì rẻ (~1 phút): bắt ngay class regression 'ffmpeg options
  # bị bỏ giữa các phiên bản' (như `-filter_complex_script` bị bỏ ở ffmpeg 8/9)
  # bằng cách gọi thẳng hàm merge_segments trên ffmpeg hệ điều hành. Nếu lỗi ở
  # đây, không tốn 15-20 phút runner Mac để phát hiện sau.
  smoke-merge-linux:
    name: Smoke — merge_segments (Linux, ffmpeg hệ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài ffmpeg mới nhất (apt build gần với runtime user)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -3
      - name: Chạy merge smoke test
        run: python tests/test_merge_smoke.py

  build:
    name: Build ${{ matrix.arch }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: smoke-merge-linux
    # Đừng đốt runner Mac cho mỗi commit main / mỗi PR — chỉ build khi đẩy tag
    # v* (release) hoặc bấm Run workflow thủ công. Smoke Linux vẫn chạy mọi lúc.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false            # 1 kiến trúc lỗi/chờ lâu KHÔNG huỷ cái kia
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (M1/M2/M3…) -> app arm64, runner sẵn, cấp nhanh
            arch: arm64
          - runner: macos-13      # Intel x86_64 -> app chạy Mac Intel (runner có thể chờ lâu hơn)
            arch: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build .app (ffmpeg + Chromium nhúng sẵn, đúng kiến trúc runner)
        run: bash build_mac.sh

      - name: Smoke test — merge_segments trên ffmpeg VENDORED (Martin Riedl)
        # Đây là bin THẬT user sẽ nhận. Nếu Martin Riedl bump ffmpeg lên phiên
        # bản mới bỏ tiếp option nào ta đang dùng, step này CHẾT trước khi
        # phát hành .app -> ta biết ngay, không đợi user báo lỗi.
        run: |
          source .venv/bin/activate
          FF="$PWD/vendor/ffmpeg/ffmpeg"
          FP="$PWD/vendor/ffmpeg/ffprobe"
          test -x "$FF" && test -x "$FP" || { echo "Thiếu ffmpeg vendored"; exit 1; }
          # Buộc find_binary() dùng bản vendored (nằm cạnh Python) qua PATH.
          export PATH="$PWD/vendor/ffmpeg:$PATH"
          python tests/test_merge_smoke.py

      - name: Smoke test — app THẬT khởi động được (bắt lỗi thiếu cryptography)
        run: |
          BIN=dist/TNT_VideoSubtitleRemover.app/Contents/MacOS/TNT_VideoSubtitleRemover
          export QT_QPA_PLATFORM=offscreen
          rm -f dist/machine_id.txt
          # macOS KHÔNG có lệnh 'timeout' -> chạy nền, đợi machine_id.txt xuất hiện
          # (app ghi file này TRƯỚC khi hiện dialog), rồi tự kill. Có file = app chạy
          # được = cryptography/OpenSSL đã đóng gói đúng.
          "$BIN" > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            [ -f dist/machine_id.txt ] && break
            kill -0 "$PID" 2>/dev/null || break     # app đã tự thoát
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "----- app output -----"; cat smoke.log || true; echo "----------------------"
          if grep -qi "No module named 'cryptography'" smoke.log; then
            echo "❌ VẪN thiếu cryptography trong bundle."; exit 1
          fi
          if [ ! -f dist/machine_id.txt ]; then
            echo "❌ App KHÔNG khởi động được tới bước license — xem app output ở trên."; exit 1
          fi
          echo "✅ App khởi động OK trên macOS (cryptography đã gói đúng). Mã máy runner:"
          cat dist/machine_id.txt
          rm -f dist/machine_id.txt

      - name: Tải kết quả lên (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TNT_VideoSubtitleRemover-mac-${{ matrix.arch }}
          path: dist/TNT_VideoSubtitleRemover-mac.zip
          if-no-files-found: error
